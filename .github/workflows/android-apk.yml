# Android beta APK: the launcher, translator (Python via Chaquopy), runtime, SDL2 and libtcc. The APK contains no game code or
# data: the player picks their own dump on the phone, which translates and compiles the game there.
# Every push to the android-beta branch builds it, keeps it as a workflow artifact and attaches it to the "android-beta"
# pre-release. On failure the end of the build log is reported as an annotation.
name: Android APK (beta)

on:
  push:
    branches: [android-beta]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.9.1'
      - name: Android SDK packages (NDK, CMake, platform)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0" > sdk.log
          tail -3 sdk.log
      - name: Third-party sources (SDL2, tinycc)
        run: android/fetch_deps.sh
      - name: Build the APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android assembleRelease --stacktrace --console=plain 2>&1 | tee build.log
      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || { [ -f sdk.log ] && cp sdk.log build.log; } || exit 0
          python3 - <<'EOF'
          import re
          lines = open('build.log', errors='replace').read().splitlines()[-400:]
          keys = re.compile(r'error|Error|FAILED|What went wrong|undefined|cannot|not found|Could not|> ')
          hits = [l for l in lines if keys.search(l)][-80:]
          msg = '\n'.join(hits)[-20000:] or '\n'.join(lines[-80:])
          enc = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print(f'::error title=Android build log::{enc}')
          EOF
      - name: Collect the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk WoohooFlightSchool-android-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: WoohooFlightSchool-android-beta.apk
          compression-level: 0
          retention-days: 30
      - name: Attach to the android-beta pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Android beta, built from ${GITHUB_SHA::7} on the android-beta branch. Install WoohooFlightSchool-android-beta.apk (allow installs from your browser), then pick your own decrypted Pilotwings Resort (USA) dump in the app: it builds the game on the phone. The APK contains no game code or data. Needs an arm64 phone with Vulkan, Android 7+."
          if gh release view android-beta >/dev/null 2>&1; then
            gh release edit android-beta --notes "$notes"
          else
            gh release create android-beta --prerelease --target "$GITHUB_SHA" --title "Android beta" --notes "$notes"
          fi
          gh release upload android-beta WoohooFlightSchool-android-beta.apk --clobber
